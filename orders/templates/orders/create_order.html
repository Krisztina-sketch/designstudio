<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Order a Design | DesignStudio</title>

    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css"
          rel="stylesheet">
</head>

<body>

    <nav class="navbar navbar-dark bg-dark">
        <div class="container">
            <a class="navbar-brand" href="/">DesignStudio</a>
        </div>
    </nav>

    <main class="container py-5">
        <div class="row justify-content-center">
            <div class="col-md-7">
                <h1 class="mb-4">Order a Design</h1>

                <p>
                    Tell us about the design you need and we'll create
                    something tailored to your project.
                </p>

                <form method="POST">
                    {% csrf_token %}

                    {{ form.as_p }}
                    <div class="alert alert-info mt-3" id="quote-box">
    Estimated price: <strong id="quote-price">Select a service</strong>
</div>

                    <button type="submit" class="btn btn-dark">
                        Submit Order
                    </button>
                </form>
            </div>
        </div>
    </main>
    <script>
    const serviceSelect = document.getElementById('id_service');
    const quotePrice = document.getElementById('quote-price');

    const servicePrices = {
        '1': 50,
        '2': 40,
        '3': 30
    };

    function updateQuote() {
        const selectedService = serviceSelect.value;
        const price = servicePrices[selectedService];

        if (price) {
            quotePrice.textContent = `£${price}.00`;
        } else {
            quotePrice.textContent = 'Select a service';
        }
    }

    serviceSelect.addEventListener('change', updateQuote);
    updateQuote();
</script>

</body>
</html>
