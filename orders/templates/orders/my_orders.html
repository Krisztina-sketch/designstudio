<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>My Orders | DesignStudio</title>

    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css"
          rel="stylesheet">
</head>

<body>

<nav class="navbar navbar-dark bg-dark">
    <div class="container">
        <a class="navbar-brand" href="/">DesignStudio</a>
        <a class="btn btn-outline-light" href="/">Back to Home</a>
    </div>
</nav>

<main class="container py-5">

    <h1 class="mb-4">My Orders</h1>

    {% if orders %}

        {% for order in orders %}
            <div class="card mb-3">
                <div class="card-body">

                    <h5 class="card-title">
                        {{ order.design_type }}
                    </h5>

                    <p class="card-text">
                        {{ order.description }}
                    </p>

                    <p class="text-muted">
                        Ordered: {{ order.created_at }}
                    </p>

                </div>
            </div>
        {% endfor %}

    {% else %}

        <p>You haven't placed any orders yet.</p>

        <a href="{% url 'create_order' %}" class="btn btn-dark">
            Order a Design
        </a>

    {% endif %}

</main>

</body>
</html>
